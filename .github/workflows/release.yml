name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin-amd64, darwin-arm64, linux-amd64, linux-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release archive
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          export GOOS="${TARGET%-*}" GOARCH="${TARGET#*-}"
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/swarmview .
          COPYFILE_DISABLE=1 tar -czf "swarmview_${GITHUB_REF_NAME}_${TARGET}.tar.gz" \
            -C dist swarmview -C "$GITHUB_WORKSPACE" \
            LICENSE README.md GUIDE.md COMPATIBILITY.md CONTRIBUTING.md SECURITY.md assets \
            integrations/opencode/package.json integrations/opencode/tui.ts \
            integrations/opencode/observer.js integrations/opencode/README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarmview-${{ matrix.target }}
          path: swarmview_*.tar.gz
          retention-days: 7

  macos-app:
    needs: verify
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build app archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}" bash desktop/macos/build.sh
          ditto -c -k --sequesterRsrc --keepParent dist/Swarmview.app "swarmview_${GITHUB_REF_NAME}_darwin_${ARCH}.app.zip"
          bash desktop/macos/dmg.sh dist/Swarmview.app "swarmview_${GITHUB_REF_NAME}_darwin_${ARCH}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarmview-app-${{ matrix.arch }}
          path: |
            swarmview_*.app.zip
            swarmview_*.dmg
          retention-days: 7

  publish:
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swarmview-*
          merge-multiple: true
          path: dist
      - name: Publish archives and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum ./*.tar.gz ./*.app.zip ./*.dmg > SHA256SUMS
          args=(--verify-tag --generate-notes --title "Swarmview $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" ./*.tar.gz ./*.app.zip ./*.dmg SHA256SUMS
